name: Release Addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PROJECT_NAME: ForeverQuestKey

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Addon Files & Metadata
        run: |
          test -f "${PROJECT_NAME}.toc" || { echo "Error: ${PROJECT_NAME}.toc missing"; exit 1; }
          test -f "Core.lua" || { echo "Error: Core.lua missing"; exit 1; }
          grep -qE "^## X-Curse-Project-ID:[[:space:]]*[1-9][0-9]*" "${PROJECT_NAME}.toc" || {
            echo "Error: Valid numeric X-Curse-Project-ID missing in ${PROJECT_NAME}.toc"
            exit 1
          }

      - name: Build Addon Zip
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="${PROJECT_NAME}-v${VERSION}.zip"

          rm -rf dist
          mkdir -p "dist/${PROJECT_NAME}"
          cp Core.lua "${PROJECT_NAME}.toc" "dist/${PROJECT_NAME}/"
          [ -f README.md ] && cp README.md "dist/${PROJECT_NAME}/"

          (cd dist && zip -rq "${ZIP_NAME}" "${PROJECT_NAME}")

          echo "zip_path=dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip_path }}
          generate_release_notes: true

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "${CF_API_KEY}" ]; then
            echo "Error: CF_API_KEY repository secret is not set."
            exit 1
          fi

          CF_ID=$(grep -i "^## X-Curse-Project-ID:" "${PROJECT_NAME}.toc" | awk '{print $3}' | tr -d '\r')
          echo "Uploading ${{ steps.build.outputs.zip_name }} to CurseForge Project ID: ${CF_ID}"

          # Query CurseForge API for the latest WoW Classic Era gameVersion ID (gameVersionTypeID 67408)
          VERSIONS_JSON=$(curl -sS -H "X-Api-Token: ${CF_API_KEY}" "https://wow.curseforge.com/api/game/versions")
          CLASSIC_VER_ID=$(echo "${VERSIONS_JSON}" | jq -r '[.[] | select(.gameVersionTypeID == 67408)] | sort_by(.id) | last | .id')

          if [ -z "${CLASSIC_VER_ID}" ] || [ "${CLASSIC_VER_ID}" = "null" ]; then
            echo "Error: Failed to resolve Classic Era gameVersion ID from CurseForge API."
            echo "Response: ${VERSIONS_JSON}"
            exit 1
          fi

          echo "Resolved Classic Era gameVersion ID: ${CLASSIC_VER_ID}"

          METADATA=$(jq -n \
            --arg changelog "Release ${{ github.ref_name }}" \
            --arg displayName "${PROJECT_NAME} ${{ github.ref_name }}" \
            --argjson gameVer "${CLASSIC_VER_ID}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              releaseType: "release",
              gameVersions: [$gameVer]
            }')

          HTTP_CODE=$(curl -sS -o cf_response.json -w "%{http_code}" \
            -X POST "https://wow.curseforge.com/api/projects/${CF_ID}/upload-file" \
            -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=${METADATA}" \
            -F "file=@${{ steps.build.outputs.zip_path }}")

          echo "CurseForge HTTP Status: ${HTTP_CODE}"
          cat cf_response.json
          echo ""

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Error: CurseForge upload failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
